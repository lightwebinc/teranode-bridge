# Scheduled vulnerability scan. CI already runs govulncheck on every push, but a
# repo nobody commits to never re-scans — and an advisory published against a
# dependency does not wait for a commit, so detection latency on a quiet repo is
# unbounded. This runs the SAME Dagger `vuln` stage on a clock against main.
# A red run here means a new advisory hit a dependency; fix by bumping it.
name: Vuln scan

on:
  schedule:
    # Tuesdays and Fridays 04:00 UTC, tracking Renovate's Tue+Fri wave so a
    # finding has a fix PR behind it the same afternoon rather than waiting out
    # the rest of the week. CodeQL still holds Mondays 03:00 — keep them apart so
    # a failure is unambiguous about which scanner found what.
    - cron: "0 4 * * 2,5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vuln:
    uses: lightwebinc/ci/.github/workflows/go-dagger.yml@3c61864e6d822d16119858e525129ea5c400d4d7 # v0.4.0
    with:
      target: ci-vuln
      common-ref: main

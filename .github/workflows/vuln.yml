# Scheduled vulnerability scan. CI already runs govulncheck on every push, but a
# repo nobody commits to never re-scans — and an advisory published against a
# dependency does not wait for a commit, so detection latency on a quiet repo is
# unbounded. This runs the SAME Dagger `vuln` stage on a clock against main.
# A red run here means a new advisory hit a dependency; fix by bumping it.
name: Vuln scan

on:
  schedule:
    # Tuesdays 04:00 UTC. CodeQL already holds Mondays 03:00 — keep them apart so
    # a failure is unambiguous about which scanner found what.
    - cron: "0 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vuln:
    name: govulncheck (dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: teranode-bridge

      # ci/main.go mounts shard-common as a SIBLING (-common=../shard-common) to
      # satisfy the go.mod replace. A scheduled run has no feature branch to
      # match, so it always takes main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lightwebinc/shard-common
          ref: main
          path: shard-common

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: teranode-bridge/ci/go.mod
          cache: false

      - name: govulncheck
        working-directory: teranode-bridge
        env:
          GOWORK: "off"
        run: make ci-vuln

name: CodeQL

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: lightwebinc/ci/.github/workflows/codeql-go.yml@a5956ef6306c9df9ea212546ebe3e240b5315669 # v0.5.2

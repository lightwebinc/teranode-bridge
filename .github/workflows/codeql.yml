name: CodeQL

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: lightwebinc/ci/.github/workflows/codeql-go.yml@3c61864e6d822d16119858e525129ea5c400d4d7 # v0.4.0

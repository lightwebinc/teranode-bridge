name: CodeQL

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: lightwebinc/ci/.github/workflows/codeql-go.yml@4bd810e61f5ffae2db7054a58d6e519368b40f00 # v0.6.0

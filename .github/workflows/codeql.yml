name: CodeQL

on:
  push:
    branches: ["main", "master"]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: lightwebinc/ci/.github/workflows/codeql-go.yml@5023f0405178abb0b30fba4f2f46d7b1667e70d2 # v0.6.3

name: image-publish

# Manual, gated image publish. No automated trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish image to ghcr.io'
        required: true
      tag:
        description: 'Image tag (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      dry-run:
        description: 'Build only, push nothing'
        type: boolean
        default: false

jobs:
  publish:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/image-publish.yml@7f9020d8d83ebd09b9a9581aa0ee6cc2f78708e0 # v0.5.1
    with:
      tag: ${{ inputs.tag }}
      environment: ""
      dry-run: ${{ inputs.dry-run }}

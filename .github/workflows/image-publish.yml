name: image-publish

# Manual, gated image publish. No automated trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish image to ghcr.io'
        required: true
      tag:
        description: 'Image tag (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      dry-run:
        description: 'Build only, push nothing'
        type: boolean
        default: false

jobs:
  publish:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/image-publish.yml@192a5b5169fd635e191104c14631525bbcd5ec60 # v0.3.0
    with:
      tag: ${{ inputs.tag }}
      environment: ""
      dry-run: ${{ inputs.dry-run }}

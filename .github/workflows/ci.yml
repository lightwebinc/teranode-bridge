name: CI

on:
  push:
    # main only: a branch that has a PR is already covered by the
    # pull_request run, and a bare-branch push ran the whole matrix a
    # second time per PR (github.ref differs between the two events, so
    # the concurrency group cannot dedupe them).
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: lightwebinc/ci/.github/workflows/go-dagger.yml@7f9020d8d83ebd09b9a9581aa0ee6cc2f78708e0 # v0.5.1

  # LICENSE-THIRD-PARTY is generated from what the binary actually links, so a
  # new dependency nobody noticed is a licence obligation nobody noticed. This
  # fails the build instead.
  licences:
    name: third-party licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: third-party licences are current
        env:
          GOWORK: "off"
        run: python3 scripts/gen-third-party-licenses.py . --check


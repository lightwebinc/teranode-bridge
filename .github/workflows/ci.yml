name: CI

on:
  push:
    # main only: a branch that has a PR is already covered by the
    # pull_request run, and a bare-branch push ran the whole matrix a
    # second time per PR (github.ref differs between the two events, so
    # the concurrency group cannot dedupe them).
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (dagger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: teranode-bridge

      - name: Resolve shard-common ref
        id: common_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$BRANCH" ] && gh api "repos/lightwebinc/shard-common/branches/$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Using shard-common@$BRANCH (matching feature branch found)"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Using shard-common@main (no matching feature branch)"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lightwebinc/shard-common
          ref: ${{ steps.common_ref.outputs.ref }}
          path: shard-common

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: teranode-bridge/ci/go.mod
          cache: false

      - name: Run Dagger pipeline
        working-directory: teranode-bridge
        env:
          GOWORK: "off"
        run: make ci
      # LICENSE-THIRD-PARTY is generated from what the binary actually links,
      # so a new dependency that nobody notices is a licence obligation that
      # nobody notices. This fails the build instead.
      # The Go above is installed from ci/go.mod, which is a DIFFERENT module
      # with a lower floor, and GOTOOLCHAIN is local so nothing auto-switches.
      # The Dagger pipeline never notices because it runs Go inside containers;
      # this step is the first thing to run go on the host, and it needs a
      # toolchain that satisfies the main module.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: teranode-bridge/go.mod
          cache: false

      - name: third-party licences are current
        # working-directory, like the Dagger step above: this repo is checked
        # out into a subdirectory beside shard-common, so the workspace root is
        # not the repo.
        working-directory: teranode-bridge
        env:
          GOWORK: "off"
        run: python3 scripts/gen-third-party-licenses.py . --check

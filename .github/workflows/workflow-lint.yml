# actionlint and zizmor over this repository's workflows.
name: Workflow lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: lightwebinc/ci/.github/workflows/workflow-lint.yml@5023f0405178abb0b30fba4f2f46d7b1667e70d2 # v0.6.3
